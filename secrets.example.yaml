# Copy to secrets.yaml and fill in. secrets.yaml is git-ignored.
# Everything here is optional: public video pages, public creator-platform data and archive mirrors need no login.

iwara:
  # Used only when a video's details are not available without logging in
  email:
  password:

cookies:
  # Used only when public data and archive mirrors both come up empty. Paste the whole Cookie value from the browser dev tools.
  fanbox:    # e.g. FANBOXSESSID=xxxx
  fantia:    # e.g. _session_id=xxxx
  patreon:   # e.g. session_id=xxxx

saucenao:
  # Reverse image search (optional). Get a free key at saucenao.com and enable reverse_search in config.yaml
  api_key:
